<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - BNtech</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 15% 20%, rgba(56, 189, 248, 0.22), transparent 20%),
        radial-gradient(circle at 85% 80%, rgba(37, 99, 235, 0.22), transparent 24%),
        radial-gradient(circle at 50% 50%, rgba(14, 165, 233, 0.08), transparent 38%),
        linear-gradient(135deg, #020617 0%, #081225 35%, #0b1f47 70%, #0f2f75 100%);
      overflow: hidden;
      position: relative;
    }

    body::before,
    body::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      filter: blur(90px);
      opacity: 0.45;
      pointer-events: none;
      animation: flutuar 8s ease-in-out infinite;
    }

    body::before {
      width: 320px;
      height: 320px;
      background: rgba(56, 189, 248, 0.55);
      top: -70px;
      left: -60px;
    }

    body::after {
      width: 380px;
      height: 380px;
      background: rgba(37, 99, 235, 0.45);
      right: -100px;
      bottom: -100px;
      animation-delay: 1.5s;
    }

    @keyframes flutuar {
      0%, 100% {
        transform: translateY(0px) translateX(0px);
      }
      50% {
        transform: translateY(10px) translateX(8px);
      }
    }

    .grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: radial-gradient(circle at center, black 35%, transparent 90%);
      pointer-events: none;
    }

    .login-container {
      width: 100%;
      max-width: 470px;
      position: relative;
      z-index: 2;
      animation: surgir 0.55s ease;
    }

    @keyframes surgir {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .login-card {
      position: relative;
      background: rgba(7, 16, 35, 0.72);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 30px;
      overflow: hidden;
      box-shadow:
        0 25px 80px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .login-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(145deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02)),
        linear-gradient(180deg, rgba(59,130,246,0.10), transparent 45%);
      pointer-events: none;
    }

    .topo-brilho {
      height: 5px;
      width: 100%;
      background: linear-gradient(90deg, #2563eb, #38bdf8, #60a5fa, #2563eb);
      background-size: 200% 100%;
      animation: brilho 4s linear infinite;
    }

    @keyframes brilho {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    .conteudo {
      position: relative;
      z-index: 2;
      padding: 34px 30px 24px;
    }

    .logo-box {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }

    .logo-anel {
      width: 112px;
      height: 112px;
      border-radius: 30px;
      padding: 4px;
      background: linear-gradient(135deg, rgba(56,189,248,0.95), rgba(37,99,235,0.95));
      box-shadow:
        0 16px 34px rgba(37,99,235,0.30),
        0 0 25px rgba(56,189,248,0.25);
    }

    .logo-anel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 26px;
      display: block;
      background: #0b1220;
    }

    .marca {
      text-align: center;
      color: #ffffff;
      font-size: 38px;
      font-weight: bold;
      letter-spacing: 0.4px;
      margin-bottom: 8px;
      text-shadow: 0 4px 20px rgba(56,189,248,0.18);
    }

    .subtitulo {
      text-align: center;
      color: rgba(255,255,255,0.82);
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 22px;
    }

    .empresa-info {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 22px;
      text-align: center;
      color: rgba(255,255,255,0.88);
      font-size: 13px;
      line-height: 1.8;
    }

    .linha-campos {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .campo {
      position: relative;
    }

    .campo label {
      display: block;
      margin-bottom: 8px;
      color: #ffffff;
      font-size: 14px;
      font-weight: bold;
    }

    .campo input {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 16px;
      padding: 15px 16px;
      padding-right: 48px;
      background: rgba(255,255,255,0.95);
      color: #111827;
      font-size: 15px;
      outline: none;
      transition: 0.22s;
    }

    .campo input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 4px rgba(56,189,248,0.18);
      transform: translateY(-1px);
    }

    .campo input::placeholder {
      color: #6b7280;
    }

    .toggle-senha {
      position: absolute;
      right: 14px;
      top: 41px;
      border: none;
      background: transparent;
      color: #2563eb;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-login {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 16px;
      margin-top: 18px;
      background: linear-gradient(90deg, #2563eb, #38bdf8);
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.22s;
      box-shadow:
        0 14px 30px rgba(37,99,235,0.32),
        inset 0 1px 0 rgba(255,255,255,0.20);
    }

    .btn-login:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    .btn-login:disabled {
      opacity: 0.75;
      cursor: not-allowed;
      transform: none;
    }

    .mensagem {
      display: none;
      margin-top: 15px;
      padding: 13px 14px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      line-height: 1.5;
    }

    .mensagem.erro {
      display: block;
      background: rgba(254, 226, 226, 0.96);
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .mensagem.sucesso {
      display: block;
      background: rgba(220, 252, 231, 0.96);
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .rodape {
      margin-top: 18px;
      text-align: center;
      color: rgba(255,255,255,0.70);
      font-size: 12px;
      line-height: 1.8;
    }

    @media (max-width: 520px) {
      .conteudo {
        padding: 28px 20px 22px;
      }

      .marca {
        font-size: 31px;
      }

      .logo-anel {
        width: 92px;
        height: 92px;
        border-radius: 24px;
      }

      .logo-anel img {
        border-radius: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="topo-brilho"></div>

      <div class="conteudo">
        <div class="logo-box">
          <div class="logo-anel">
            <img src="assets/logo.jpeg" alt="Logo BNtech">
          </div>
        </div>

        <div class="marca">BNtech</div>

        <div class="subtitulo">
          Entre para acessar o sistema profissional de vendas e atendimento.
        </div>

        <div class="empresa-info">
          <strong>Telefone:</strong> 69993996455<br>
          <strong>Endereço:</strong> Interval José Brasil, 231, Novo Cacoal
        </div>

        <div class="linha-campos">
          <div class="campo">
            <label for="usuario">Usuário</label>
            <input type="text" id="usuario" placeholder="Digite seu usuário" autocomplete="username">
          </div>

          <div class="campo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password">
            <button type="button" class="toggle-senha" id="toggleSenha">Mostrar</button>
          </div>
        </div>

        <button class="btn-login" id="btnEntrar">Entrar</button>

        <div id="mensagem" class="mensagem"></div>

        <div class="rodape">
          Login conectado ao backend com perfil e permissões completas do usuário.<br>
          BNtech • Sistema PDV e Assistência Técnica
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://pdv-1-30jy.onrender.com";

    function $(id) {
      return document.getElementById(id);
    }

    function exibirMensagem(texto, tipo = "erro") {
      const box = $("mensagem");
      if (!box) return;

      box.className = `mensagem ${tipo}`;
      box.textContent = texto;
      box.style.display = "block";
    }

    function limparMensagem() {
      const box = $("mensagem");
      if (!box) return;
      box.style.display = "none";
      box.textContent = "";
      box.className = "mensagem";
    }

    function setBotaoCarregando(ativo) {
      const btn = $("btnEntrar");
      if (!btn) return;

      btn.disabled = ativo;
      btn.textContent = ativo ? "Entrando..." : "Entrar";
    }

    function alternarSenha() {
      const campo = $("senha");
      const botao = $("toggleSenha");

      if (!campo || !botao) return;

      if (campo.type === "password") {
        campo.type = "text";
        botao.textContent = "Ocultar";
      } else {
        campo.type = "password";
        botao.textContent = "Mostrar";
      }
    }

    async function fazerLogin() {
      limparMensagem();

      const usuario = $("usuario").value.trim();
      const senha = $("senha").value.trim();

      if (!usuario) {
        exibirMensagem("Digite o usuário.", "erro");
        return;
      }

      if (!senha) {
        exibirMensagem("Digite a senha.", "erro");
        return;
      }

      try {
        setBotaoCarregando(true);

        const response = await fetch(`${API_BASE}/auth/login`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            usuario: usuario,
            senha: senha
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || "Usuário ou senha inválidos.");
        }

        localStorage.setItem("operadorLogadoPDV", JSON.stringify(data));
        exibirMensagem("Login realizado com sucesso.", "sucesso");

        setTimeout(() => {
          window.location.href = "index.html";
        }, 700);
      } catch (error) {
        console.error(error);
        exibirMensagem(error.message || "Erro ao fazer login.", "erro");
      } finally {
        setBotaoCarregando(false);
      }
    }

    $("btnEntrar")?.addEventListener("click", fazerLogin);
    $("toggleSenha")?.addEventListener("click", alternarSenha);

    $("senha")?.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        fazerLogin();
      }
    });

    $("usuario")?.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        fazerLogin();
      }
    });
  </script>
</body>
</html>
